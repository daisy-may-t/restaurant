<!DOCTYPE html>
{% from '_icons.html' import icon %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Restaurant App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <span class="app-name">Restaurant App</span>
        <nav class="primary-nav" aria-label="Main navigation">
          <a href="{{ url_for('tables') }}" {% if request.endpoint not in ('menu', 'edit_menu_item', 'delete_menu_item_route') %}aria-current="page"{% endif %}>{{ icon('table', 'icon--nav-table') }} Tables</a>
          <a href="{{ url_for('menu') }}" {% if request.endpoint in ('menu', 'edit_menu_item', 'delete_menu_item_route') %}aria-current="page"{% endif %}>{{ icon('utensils') }} Menu</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
