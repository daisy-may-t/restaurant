{% extends 'base.html' %}
{% from '_icons.html' import icon %}

{% block title %}Ticket preview - {{ table.name }}{% endblock %}

{% block content %}
  <section class="panel ticket-preview">
    <h2>Ticket preview</h2>
    <pre>{{ ticket }}</pre>
    <div class="ticket-actions">
      <button type="button" class="primary" onclick="window.print()">{{ icon('printer') }} Print ticket</button>
      <a class="action-link" href="{{ url_for('table_order', table_id=table.id) }}">{{ icon('arrow-left') }} Back to {{ table.name }}</a>
    </div>
  </section>
{% endblock %}
