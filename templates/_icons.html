{% macro icon(name, class_name='') -%}
  <svg class="icon {{ class_name }}" viewBox="{{ '0 0 32 24' if name == 'table' else '0 0 24 24' }}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    {% if name == 'table' %}
      <ellipse cx="16" cy="8" rx="6" ry="2" />
      <path d="M13 10v10M19 10v10" />
      <path d="M2 5v9h6M3 14v6M8 14v6" />
      <path d="M30 5v9h-6M29 14v6M24 14v6" />
    {% elif name == 'stool' %}
      <rect x="3" y="7" width="18" height="4" rx="2" />
      <path d="M6 11v10M18 11v10" />
    {% elif name == 'utensils' %}
      <path d="M3 2v7a3 3 0 0 0 6 0V2M6 2v20M17 2c-2 2-3 5-3 9h3v11" />
    {% elif name == 'arrow-left' %}
      <path d="M20 12H4m6-6-6 6 6 6" />
    {% elif name == 'chevron-right' %}
      <path d="m9 5 7 7-7 7" />
    {% elif name == 'plus' %}
      <path d="M12 5v14M5 12h14" />
    {% elif name == 'printer' %}
      <path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
      <path d="M6 15h12v6H6zM18 12h.01" />
    {% elif name == 'reset' %}
      <path d="M4 11a8 8 0 1 1 2 7M4 4v7h7" />
    {% endif %}
  </svg>
{%- endmacro %}
